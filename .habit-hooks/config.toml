plugins = ["typescript", "generic"]
transformers = ["allow-aaa", "snooze", "habit-hooks-disable"]

# Generic line-count (raw 200) duplicates ESLint max-lines (oversized-file).
# ESLint remains the file-length detector: .ts 400, .tsx 150.
[sensors.line-count]
disabled = true

[smells."oversized-file"]
severity = "enforced"
guide = "oversized-file.md"

[smells."sonarjs/cognitive-complexity"]
severity = "enforced"
guide = "sonarjs-cognitive-complexity.md"

[smells.non-essential-comment]
severity = "enforced"

[smells."coding-guide/max-params-project"]
severity = "enforced"
