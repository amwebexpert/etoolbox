name: Validate

# Shared validation job: install, lint, typecheck, test.
# - Runs directly on PRs targeting main, so a broken build is caught
#   before merge instead of during the release run.
# - Also called by release.yml as a gate before publishing, so the release
#   pipeline runs the exact same checks (no drift between the two).
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Lint package.json
        run: bun run lint:package

      - name: Check unused files/exports/dependencies
        run: bun run lint:unused

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
